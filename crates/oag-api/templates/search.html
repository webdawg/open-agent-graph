<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search — OAG</title>
</head>
<body>
<h1>Search</h1>
<form method="get" action="/ui/search">
  <input type="hidden" name="key" value="{{ key }}">
  <input type="text" name="q" value="{{ query }}" placeholder="search the graph...">
  <button type="submit">Search</button>
</form>

{% if has_searched %}
<h2>Results for &#8220;{{ query }}&#8221;</h2>
{% if results.is_empty() %}
<p>No matches.</p>
{% else %}
<ul>
{% for r in results %}
  <li><a href="{{ r.link }}">{{ r.canonical_identifier }}</a>{% if let Some(name) = r.name %} — {{ name }}{% endif %}</li>
{% endfor %}
</ul>
{% endif %}
{% endif %}
</body>
</html>
