[workspace]
resolver = "2"
members = [
    "crates/oag-core",
    "crates/oag-crypto",
    "crates/oag-storage",
    "crates/oag-events",
    "crates/oag-graph",
    "crates/oag-api",
    "crates/oag-mcp",
    "crates/oag-sync",
    "crates/oag-crawler",
    "crates/oag-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
oag-core = { path = "crates/oag-core" }
oag-crypto = { path = "crates/oag-crypto" }
oag-storage = { path = "crates/oag-storage" }
oag-events = { path = "crates/oag-events" }
oag-graph = { path = "crates/oag-graph" }
oag-api = { path = "crates/oag-api" }
oag-mcp = { path = "crates/oag-mcp" }
oag-sync = { path = "crates/oag-sync" }
oag-crawler = { path = "crates/oag-crawler" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7", "serde"] }
ed25519-dalek = { version = "3", features = ["rand_core", "serde"] }
blake3 = "1"
sha2 = "0.11"
data-encoding = "2"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "cors"] }
clap = { version = "4", features = ["derive"] }
figment = { version = "0.10", features = ["toml", "env"] }
rmcp = { version = "3", features = ["server", "transport-streamable-http-server", "macros"] }
rand = "0.8"
schemars = "1"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
http = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
scraper = "0.27"
url = "2"
